#  Auto tag version updated.  updates v1 when v1.2 is pushed, updates v1.2 when 1.2.4 is pushed.
update-version-branches:
  stage: release
  script:
    - |
        git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        ./.github/scripts/update-version-branches.sh
  variables:
      THIS_COMMIT: $CI_COMMIT_SHA
      THIS_TAG: $CI_COMMIT_TAG

  rules:
    - if: $CI_COMMIT_TAG
    #Match basically [anything-]v1.2[.3][rc0][-r1]  except a bit looser here:
    # ex  rc-v1.2.1-beta
    #- if: $CI_COMMIT_TAG =~ /^(.+[-\/])?v\\d+(\\.\\d+)*([a-z]+\\d*)?(-.*)?$/

